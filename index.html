<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>vape-catalog</title>
    
    <!-- Global Error Catcher for Debugging -->
    <script>
      function showError(msg) {
        var errDiv = document.createElement('div');
        errDiv.style.position = 'relative';
        errDiv.style.width = '100%';
        errDiv.style.padding = '20px';
        errDiv.style.backgroundColor = 'red';
        errDiv.style.color = 'white';
        errDiv.style.zIndex = '999999';
        errDiv.style.fontSize = '14px';
        errDiv.style.fontFamily = 'monospace';
        errDiv.style.wordWrap = 'break-word';
        errDiv.innerHTML = msg;
        if(document.body) document.body.appendChild(errDiv);
        else document.documentElement.appendChild(errDiv);
      }

      window.onerror = function(message, source, lineno, colno, error) {
        showError('<b>JS CRASH:</b> ' + message + '<br>Line: ' + lineno + '<br>Source: ' + source);
        return false;
      };
      
      window.addEventListener("unhandledrejection", function(event) {
        showError('<b>PROMISE CRASH:</b> ' + event.reason);
      });

      window.addEventListener("error", function(e) {
        if (e.target && (e.target.tagName === 'SCRIPT' || e.target.tagName === 'LINK')) {
          showError('<b>NETWORK ERROR:</b> Failed to load ' + e.target.src + (e.target.href || ''));
        }
      }, true);
    </script>
    
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script>
      try {
        if (window.Telegram && window.Telegram.WebApp) {
          window.Telegram.WebApp.ready();
          window.Telegram.WebApp.expand();
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
